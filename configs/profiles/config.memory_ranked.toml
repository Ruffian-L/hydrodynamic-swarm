# Ablation: ranked Top-K memory picker (vs soft-sum default).
# Soft path remains default in config.example.toml / MemoryConfig::default.
#
#   cargo run --release -- --config configs/profiles/config.memory_ranked.toml \
#     --prompt "Explain the Physics of Friendship in one short paragraph." \
#     --tokens 65
#
# Pair with soft baseline (same physics, soft sum):
#   --config config.example.toml   # or omit; memory_force_mode = "soft"
#
# Telemetry: JSONL config has memory_force_mode; each step has memory_ranked bool.

[physics]
dt = 0.035
viscosity_scale = 0.25
force_cap = 3.1
splat_sigma = 30.0
splat_alpha = 1.0
min_splat_dist = 18.0
splat_delta_threshold = 90.0
gradient_topk = 1024
steer_hidden = true
manifold_pullback = 0.28
splat_lambda_default = 0.03
pain_decay_factor = 0.7
splat_force_scale = 0.14
splat_force_max = 16.0
goal_force_scale = 0.10
goal_force_max = 32.0
goal_late_start = 48
goal_late_span = 30
goal_late_end = 0.35
online_splat_interval = 8
field_wake_mode = "dist_weighted"
field_wake_k = 1
field_wake_scale = 0.187
field_wake_max = 25.0
field_grad_blend = 0.10
field_wake_dist_tau = 80.0
force_ramp_tokens = 15
force_ramp_start = 0.15
targeted_splat_only = true
prefill_micro_dream = false
pain_recovery_ocean = false
prefill_bridge_scar = true
prefill_bridge_sigma = 90.0
prefill_bridge_alpha = 0.75
prefill_bridge_lambda = 0.005
prefill_bridge_offset_frac = 0.35

[logit_physics]
field_alpha = 0.0
splat_scale = 0.0
governor_enabled = false

[hooks]
enabled = false

[generation]
max_tokens = 65
temperature = 0.88
rep_penalty = 1.36
min_success_tokens = 10
pleasure_alpha = 0.85
pain_alpha = -0.4
default_prompt = "Explain the Physics of Friendship in one short paragraph."

[memory]
max_splats = 48
consolidation_dist = 18.0
decay_rate = 0.96
prune_threshold = 0.03
online_decay_rate = 0.975
max_prefill_bridges = 24
# Ranked Top-K picker ON
memory_force_mode = "ranked"
memory_pick_k = 8
memory_pick_selective = true
memory_pick_entropy_min = 2.5
memory_pick_margin_max = 0.15
memory_pick_residual_l2_min = 0.0
memory_pick_quality_weight = 1.0
memory_pick_fp_weight = 1.0

[micro_dream]
entropy_threshold = 3.0
fixed_interval = 25
adaptive_interval = 8
blend_normal = 0.06
blend_high_entropy = 0.10
topocot_threshold = 12.0
