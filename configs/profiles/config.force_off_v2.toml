# True three-surface baseline: residual steering, logit physics, and
# transformer-layer hooks are all disabled.
# Matched generation params to physics_light for fair comparison.
[physics]
force_cap = 0.0
steer_hidden = true
splat_force_scale = 0.0
goal_force_scale = 0.0
field_wake_scale = 0.0
force_ramp_tokens = 0
prefill_bridge_scar = false
prefill_micro_dream = false
pain_recovery_ocean = false

[logit_physics]
field_alpha = 0.0
splat_scale = 0.0
governor_enabled = false

[hooks]
enabled = false

[generation]
max_tokens = 100
temperature = 0.75
rep_penalty = 1.10
min_success_tokens = 10
pleasure_alpha = 0.85
pain_alpha = -0.4

[memory]
memory_force_mode = "soft"
