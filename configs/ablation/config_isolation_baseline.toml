# ABLATION RECEIPT — isolation baseline (Step 1)
# Pure Gemma-4 forward + sampling. All custom residual writes OFF.
# Jacobian measure interval=0 (disabled). Endocrine via --no-endocrine CLI.
# Memory cleared via --clear-memory; do not reload scars into residual.

[physics]
force_cap = 0.0
steer_hidden = true
splat_force_scale = 0.0
goal_force_scale = 0.0
field_wake_scale = 0.0
force_ramp_tokens = 0
prefill_bridge_scar = false
prefill_micro_dream = false
pain_recovery_ocean = false
online_splat_interval = 99999
targeted_splat_only = true

[logit_physics]
field_alpha = 0.0
splat_scale = 0.0
governor_enabled = false

[hooks]
enabled = false

[jacobian]
interval = 0
epsilon = 0.0001
sites = "final_norm"
top_k = 16
max_dims = 0
trace_path = ""

# Label answer/revise/settle in COLLAPSE_PROBE (no extra force).
# docs/SELF_REG_PHASES.md — line_repeat + wait_loop settle clamps.
# Force-in-revise: configs/ablation/config_isolation_self_reg_force.toml
[self_reg]
mode = "observe"
min_answer_tokens = 3
revise_entropy_delta = 1.2
revise_margin_max = 0.08
revise_line_repeat = 2
settle_line_repeat = 4
line_repeat_min_chars = 6
settle_wait_loops = 3

[generation]
max_tokens = 128
temperature = 0.0
top_k = 1
top_p = 1.0
rep_penalty = 1.0

[memory]
memory_force_mode = "soft"
max_splats = 1

[micro_dream]
entropy_threshold = 99.0
fixed_interval = 99999
adaptive_interval = 99999
blend_normal = 0.0
blend_high_entropy = 0.0
topocot_threshold = 999.0
