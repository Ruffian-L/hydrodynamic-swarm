# PHYSICS ON — test if residual force breaks the collapse loop
# Same base as config_isolation_self_reg_force.toml but with physics knobs ON

[physics]
force_cap = 3.5
steer_hidden = true
splat_force_scale = 0.3
goal_force_scale = 0.15
field_wake_scale = 0.5
force_ramp_tokens = 12
prefill_bridge_scar = false
prefill_micro_dream = false
pain_recovery_ocean = false
online_splat_interval = 8
targeted_splat_only = true

[logit_physics]
field_alpha = 0.5
splat_scale = 0.3
governor_enabled = true

[hooks]
enabled = true
norm_fraction = 0.0005
start_frac = 0.5
end_frac = 1.0
site = "post_mlp"

[jacobian]
interval = 10
epsilon = 0.0001
max_dims = 0

