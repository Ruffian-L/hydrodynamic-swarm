<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SplatLens — 4B slice demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box }
    body { background: #0F111A; color: #7B8CA8; font-family: system-ui, sans-serif; overflow: hidden }
    canvas { display: block; width: 100vw; height: 100vh }
    #hud {
      position: fixed; top: 14px; left: 14px; z-index: 10;
      background: rgba(15,17,26,.9); border: 1px solid rgba(80,100,140,.2);
      border-radius: 10px; padding: 12px 16px; max-width: 380px; backdrop-filter: blur(12px);
    }
    #hud h1 { font-size: 13px; color: #A0B4D0; letter-spacing: 1.2px; margin-bottom: 6px }
    #hud p { font-size: 11px; line-height: 1.45; color: #5A6A82 }
    #hud .ok { color: #2DD4A8 } #hud .warn { color: #D4A44C }
    #gen {
      position: fixed; top: 14px; right: 14px; z-index: 10; width: min(420px, 42vw);
      max-height: 28vh; overflow: auto; background: rgba(15,17,26,.88);
      border: 1px solid rgba(80,100,140,.2); border-radius: 10px; padding: 12px 14px;
      font-size: 13px; line-height: 1.5; color: #C8D4E8;
    }
    #gen .cur { background: rgba(64,224,208,.25); border-radius: 3px }
    #bar {
      position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 10;
      display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center;
      background: rgba(15,17,26,.92); border: 1px solid rgba(80,100,140,.25);
      border-radius: 12px; padding: 10px 14px;
    }
    button, label.file {
      background: rgba(64,224,208,.12); border: 1px solid rgba(64,224,208,.35);
      color: #9EEDE4; border-radius: 8px; padding: 6px 12px; font-size: 12px; cursor: pointer;
    }
    button:hover, label.file:hover { background: rgba(64,224,208,.22) }
    button.active { background: rgba(64,224,208,.3) }
    input[type=range] { width: 160px; accent-color: #40E0D0 }
    input[type=file] { display: none }
    .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 3px }
    #drop {
      position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center;
      background: rgba(15,17,26,.75); border: 2px dashed #40E0D0; color: #9EEDE4; font-size: 18px;
    }
    #drop.show { display: flex }
  </style>
</head>
<body>
  <div id="hud">
    <h1>SPLATLENS · 4B SLICE</h1>
    <p id="meta">Drop a <code>.viz.json</code> or run <code>./demo_slice.sh</code></p>
    <p style="margin-top:6px">
      <span class="dot" style="background:#40E0D0"></span>Trail
      <span class="dot" style="background:#D4A44C"></span>Goal
      <span class="dot" style="background:#2DD4A8"></span>Pleasure
      <span class="dot" style="background:#8B3A3A"></span>Pain
    </p>
    <p style="margin-top:6px;color:#2A3448">Drag orbit · Scroll zoom · Space play/pause · B4d-q short paragraph demo</p>
  </div>
  <div id="gen">Load a session to see tokens…</div>
  <div id="bar">
    <label class="file">Load .viz.json<input type="file" id="file" accept=".json,.viz.json,application/json"></label>
    <button id="play">Play</button>
    <button id="pause">Pause</button>
    <input type="range" id="scrub" min="0" max="0" value="0">
    <span id="step">0/0</span>
  </div>
  <div id="drop">Drop .viz.json here</div>
  <canvas id="c"></canvas>
  <script>
    // ─── state ───────────────────────────────────────────────
    let snaps = [], field = [], scars = [], goal = [0, 0, 0], prompt = '';
    let cx = 0, cy = 0, cz = 0, maxDist = 1;
    let tC = [], fC = [], spC = [], gC = [0, 0, 0];
    let vis = 0, playing = false, lastPlay = 0, speed = 180;
    let camTheta = 0.55, camPhi = 0.35, camDist = 8, panX = 0, panY = 0;
    let drag = false, pan = false, lx = 0, ly = 0;

    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const dpr = devicePixelRatio || 1;
    function resize() {
      canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr;
      canvas.style.width = innerWidth + 'px'; canvas.style.height = innerHeight + 'px';
    }
    resize(); addEventListener('resize', resize);

    // ─── load session ────────────────────────────────────────
    function loadSession(data) {
      prompt = data.prompt || '';
      snaps = data.snapshots || [];
      field = data.field_points_3d || [];
      scars = data.splat_scars || [];
      goal = data.goal_position_3d || [0, 0, 0];
      if (!snaps.length) { alert('No snapshots in file'); return; }

      // center on trail
      cx = cy = cz = 0;
      for (const s of snaps) { const p = s.position_3d; cx += p[0]; cy += p[1]; cz += p[2]; }
      const n = snaps.length; cx /= n; cy /= n; cz /= n;
      maxDist = 1;
      for (const s of snaps) {
        const p = s.position_3d;
        const d = Math.hypot(p[0] - cx, p[1] - cy, p[2] - cz);
        if (d > maxDist) maxDist = d;
      }
      tC = snaps.map(s => [s.position_3d[0] - cx, s.position_3d[1] - cy, s.position_3d[2] - cz]);
      fC = field.slice(0, 800).map(p => [p[0] - cx, p[1] - cy, p[2] - cz]);
      spC = scars.map(s => ({
        p: [s.position_3d[0] - cx, s.position_3d[1] - cy, s.position_3d[2] - cz],
        a: s.alpha, sig: s.sigma
      }));
      gC = [goal[0] - cx, goal[1] - cy, goal[2] - cz];
      camDist = maxDist * 2.8;
      vis = snaps.length;
      document.getElementById('scrub').max = snaps.length - 1;
      document.getElementById('scrub').value = snaps.length - 1;
      document.getElementById('meta').innerHTML =
        `<span class="ok">Loaded</span> · ${snaps.length} steps · dim ${data.embedding_dim || '?'} · ` +
        `${scars.length} scars<br>"${prompt.replace(/</g, '&lt;').slice(0, 80)}"`;
      updateText();
      updateStep();
    }

    function updateText() {
      let h = '';
      for (let i = 0; i < Math.min(vis, snaps.length); i++) {
        const t = (snaps[i].token_text || '').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        h += i === vis - 1 ? `<span class="cur">${t}</span>` : t;
      }
      document.getElementById('gen').innerHTML = h || '…';
    }
    function updateStep() {
      document.getElementById('step').textContent = vis + '/' + snaps.length;
      document.getElementById('scrub').value = Math.max(0, vis - 1);
    }

    // file + drop
    document.getElementById('file').addEventListener('change', e => {
      const f = e.target.files[0]; if (!f) return;
      f.text().then(t => loadSession(JSON.parse(t))).catch(err => alert(err));
    });
    const drop = document.getElementById('drop');
    addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('show'); });
    addEventListener('dragleave', e => { if (e.target === drop) drop.classList.remove('show'); });
    addEventListener('drop', e => {
      e.preventDefault(); drop.classList.remove('show');
      const f = e.dataTransfer.files[0]; if (!f) return;
      f.text().then(t => loadSession(JSON.parse(t))).catch(err => alert(err));
    });

    // try auto-load baked session from same folder (demo_slice.sh)
    fetch('latest_demo.viz.json', { cache: 'no-store' })
      .then(r => r.ok ? r.json() : null)
      .then(d => { if (d) loadSession(d); })
      .catch(() => {});

    addEventListener('keydown', e => {
      if (e.key === ' ' || e.code === 'Space') {
        const tag = e.target.tagName;
        const role = e.target.getAttribute('role');
        const isInteractive = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'BUTTON' || tag === 'SELECT' || role === 'button' || e.target.isContentEditable;
        if (!isInteractive) {
          e.preventDefault();
          if (playing) {
            playing = false;
          } else {
            playing = true;
            if (vis >= snaps.length) vis = 1;
            lastPlay = performance.now();
          }
        }
      }
    });
    // controls
    document.getElementById('play').onclick = () => { playing = true; if (vis >= snaps.length) vis = 1; lastPlay = performance.now(); };
    document.getElementById('pause').onclick = () => { playing = false; };
    document.getElementById('scrub').oninput = e => { playing = false; vis = +e.target.value + 1; updateText(); updateStep(); };

    // camera
    canvas.addEventListener('mousedown', e => { drag = true; pan = e.shiftKey; lx = e.clientX; ly = e.clientY; });
    addEventListener('mouseup', () => { drag = false; });
    addEventListener('mousemove', e => {
      if (!drag) return;
      const dx = e.clientX - lx, dy = e.clientY - ly; lx = e.clientX; ly = e.clientY;
      if (pan) { panX -= dx * camDist * 0.001; panY += dy * camDist * 0.001; }
      else { camTheta += dx * 0.005; camPhi = Math.max(-1.4, Math.min(1.4, camPhi + dy * 0.005)); }
    });
    canvas.addEventListener('wheel', e => { e.preventDefault(); camDist = Math.max(0.4, camDist * (1 + e.deltaY * 0.001)); }, { passive: false });

    function project(p) {
      const st = Math.sin(camTheta), ct = Math.cos(camTheta);
      const sp = Math.sin(camPhi), cp = Math.cos(camPhi);
      const x = p[0], y = p[1], z = p[2];
      const x1 = x * ct + z * st;
      const z1 = -x * st + z * ct;
      const y1 = y * cp - z1 * sp;
      const z2 = y * sp + z1 * cp;
      const sc = Math.min(canvas.width, canvas.height) * 0.38 / Math.max(camDist, 0.01);
      return [
        canvas.width / 2 + (x1 + panX) * sc,
        canvas.height / 2 - (y1 + panY) * sc,
        z2
      ];
    }

    function frame(now) {
      if (playing && snaps.length) {
        if (now - lastPlay > speed) {
          vis = Math.min(snaps.length, vis + 1);
          lastPlay = now;
          updateText(); updateStep();
          if (vis >= snaps.length) playing = false;
        }
      }
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = '#0F111A';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // field dust
      ctx.globalAlpha = 0.15;
      ctx.fillStyle = '#1E2840';
      for (const p of fC) {
        const q = project(p);
        if (q[2] < -camDist * 2) continue;
        ctx.beginPath(); ctx.arc(q[0], q[1], 1.2 * dpr, 0, 6.28); ctx.fill();
      }

      // scars
      for (const s of spC) {
        const q = project(s.p);
        const r = Math.max(3, Math.min(18, Math.abs(s.sig) * 0.08)) * dpr;
        ctx.globalAlpha = Math.min(0.55, 0.15 + Math.abs(s.a) * 0.15);
        ctx.fillStyle = s.a >= 0 ? '#2DD4A8' : '#8B3A3A';
        ctx.beginPath(); ctx.arc(q[0], q[1], r, 0, 6.28); ctx.fill();
      }

      // trail
      ctx.globalAlpha = 1;
      ctx.lineWidth = 2 * dpr;
      ctx.strokeStyle = '#40E0D0';
      ctx.beginPath();
      for (let i = 0; i < Math.min(vis, tC.length); i++) {
        const q = project(tC[i]);
        if (i === 0) ctx.moveTo(q[0], q[1]); else ctx.lineTo(q[0], q[1]);
      }
      ctx.stroke();

      // step dots (jump = high δ)
      const maxD = Math.max(...snaps.map(s => s.steering_delta || 0), 1);
      for (let i = 0; i < Math.min(vis, tC.length); i++) {
        const q = project(tC[i]);
        const d = snaps[i].steering_delta || 0;
        const jump = d > maxD * 0.7;
        ctx.fillStyle = jump ? '#F0E6C8' : '#40E0D0';
        ctx.globalAlpha = i === vis - 1 ? 1 : 0.55;
        ctx.beginPath(); ctx.arc(q[0], q[1], (i === vis - 1 ? 5 : 2.5) * dpr, 0, 6.28); ctx.fill();
      }

      // goal
      const g = project(gC);
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = '#D4A44C';
      ctx.beginPath(); ctx.arc(g[0], g[1], 7 * dpr, 0, 6.28); ctx.fill();
      ctx.strokeStyle = 'rgba(212,164,76,.4)';
      ctx.lineWidth = 2 * dpr;
      ctx.beginPath(); ctx.arc(g[0], g[1], 14 * dpr, 0, 6.28); ctx.stroke();

      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
