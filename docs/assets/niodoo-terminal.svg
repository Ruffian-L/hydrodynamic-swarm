<svg xmlns="http://www.w3.org/2000/svg" width="720" height="220" viewBox="0 0 720 220" role="img" aria-label="Niodoo terminal mock">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12151e"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- window -->
  <rect x="8" y="8" width="704" height="204" rx="12" fill="url(#bg)" stroke="#40E0D044" stroke-width="1.5"/>
  <!-- titlebar -->
  <rect x="8" y="8" width="704" height="36" rx="12" fill="#141824"/>
  <rect x="8" y="32" width="704" height="12" fill="#141824"/>
  <line x1="8" y1="44" x2="712" y2="44" stroke="#40E0D022" stroke-width="1"/>
  <!-- traffic lights -->
  <circle cx="32" cy="26" r="5.5" fill="#ff5f57"/>
  <circle cx="52" cy="26" r="5.5" fill="#febc2e"/>
  <circle cx="72" cy="26" r="5.5" fill="#28c840"/>
  <text x="96" y="30" font-family="ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="12" fill="#6A7A92">
    <tspan fill="#40E0D0">niodoo@hydro</tspan>
    <tspan fill="#6A7A92"> · </tspan>
    <tspan fill="#d1b3ff">~/museum</tspan>
    <tspan fill="#5A6A82">  —  SplatLens</tspan>
  </text>
  <!-- body -->
  <text font-family="ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="13" fill="#6A7A92">
    <tspan x="28" y="72" fill="#6A7A82">$</tspan>
    <tspan x="44" y="72" fill="#9EEDE4" filter="url(#glow)">./splat-lens museum</tspan>
    <tspan x="28" y="98" fill="#2DD4A8">✓</tspan>
    <tspan x="48" y="98" fill="#A0B4D0">recordings online · no GPU required to watch</tspan>
    <tspan x="28" y="124" fill="#6A7A82">$</tspan>
    <tspan x="44" y="124" fill="#9EEDE4">open continuity</tspan>
    <tspan x="28" y="150" fill="#D4A44C">→</tspan>
    <tspan x="48" y="150" fill="#C8D4E8">reload + soft bridge · friendship basin warm after death</tspan>
    <tspan x="28" y="180" fill="#5A6A82">Built by Jason Van Pham in collaboration with Grok · Claude · ChatGPT · Gemini · Codex</tspan>
  </text>
  <!-- cursor -->
  <rect x="44" y="190" width="8" height="14" fill="#40E0D0" opacity="0.85">
    <animate attributeName="opacity" values="0.85;0.15;0.85" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
