[package]
name = "hydrodynamic-swarm"
version = "0.2.0"
edition = "2021"
description = "Unified Hydrodynamic Ouroboros Swarm — SplatRAG + 9-Node Matrix"
license = "MIT-0"
readme = "README.md"

# `jlens-gguf` is the Jacobian-lens sidecar (docs/jlens-gguf/). It loads models through
# this crate's `loader` module rather than its own copy, so the lens measures the same
# weights the swarm runs. See docs/jlens-gguf/DESIGN.md §7.
[workspace]
members = ["jlens-gguf"]
resolver = "2"

[features]
default = ["with-candle", "with-cuda"]
with-candle = ["candle-core", "candle-nn", "candle-transformers"]
with-cuda = ["candle-core/cuda", "candle-nn/cuda"]
with-metal = ["candle-core/metal", "candle-nn/metal"]
metal-compute = []

[dependencies]
tokio = { version = "1.35", features = ["full"] }
nalgebra = "0.32"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
safetensors = "0.7"
rand = { version = "0.10", features = ["std", "thread_rng"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tokenizers = "0.22"
toml = "1"
reqwest = { version = "0.12", features = ["json"] }
thiserror = "1.0"
bincode = "1.3"
parking_lot = "0.12"
futures = "0.3"
crossbeam = "0.8"
rayon = "1.7"
num-traits = "0.2"
num-derive = "0.3"
unicode-normalization = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
crossterm = "0.29"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }

candle-core = { version = "0.9", optional = true }
candle-nn = { version = "0.9", optional = true }
candle-transformers = { version = "0.9", optional = true }
# cudarc is pulled transitively by candle when `with-cuda` is enabled.
# Do not list it as a direct dep — that forced CUDA headers on every build.
# No hf-hub: models/tokenizers are local paths only (operator downloads offline).

[build-dependencies]
cc = "1.0"
