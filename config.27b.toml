splat_force_max = 28.0
goal_force_scale = 0.12
goal_force_max = 40.0
goal_late_start = 60
goal_late_span = 40
goal_late_end = 0.40
online_splat_interval = 6
field_wake_mode = "dist_weighted"
field_wake_k = 1
field_wake_scale = 0.20
field_wake_max = 25.0
field_grad_blend = 0.10
field_wake_dist_tau = 80.0
field_logit_alpha = 0.0
