# =============================================================================
# B27 — 27B instruct retune (Option B)
# Lessons from 4B B4d-q + first 27B port smoke (F_s late climb, F_a pinned at 40)
#
# Changes vs naive port:
#   softer splat mass (0.16/18) + online_decay 0.97
#   earlier late F_a (start 45 → ×0.35) + lower goal scale/max
#   slightly pickier deposits (interval 8, thr 85)
# 4B demos stay on config.toml (B4d-q). Activate this profile only for 27B runs.
# =============================================================================

[physics]
dt = 0.035
viscosity_scale = 0.25
force_cap = 3.5
splat_sigma = 36.0
splat_alpha = 1.0
min_splat_dist = 24.0
splat_delta_threshold = 85.0
gradient_topk = 1024
steer_hidden = true
manifold_pullback = 0.28
splat_lambda_default = 0.025
pain_decay_factor = 0.7
splat_force_scale = 0.16
splat_force_max = 18.0
goal_force_scale = 0.10
goal_force_max = 32.0
goal_late_start = 45
goal_late_span = 35
goal_late_end = 0.35
online_splat_interval = 8
field_wake_mode = "dist_weighted"
field_wake_k = 1
field_wake_scale = 0.18
field_wake_max = 25.0
field_grad_blend = 0.10
field_wake_dist_tau = 80.0
field_logit_alpha = 0.0
force_ramp_tokens = 15
force_ramp_start = 0.18
targeted_splat_only = true
prefill_micro_dream = false
pain_recovery_ocean = false

[generation]
max_tokens = 100
temperature = 0.80
rep_penalty = 1.28
min_success_tokens = 10
pleasure_alpha = 0.9
pain_alpha = -0.45
default_prompt = "Explain the Physics of Friendship in one short paragraph."

[memory]
max_splats = 56
consolidation_dist = 22.0
decay_rate = 0.96
prune_threshold = 0.03
online_decay_rate = 0.97

[micro_dream]
entropy_threshold = 3.0
fixed_interval = 25
adaptive_interval = 8
blend_normal = 0.06
blend_high_entropy = 0.10
topocot_threshold = 12.0
