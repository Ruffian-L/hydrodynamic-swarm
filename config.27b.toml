# =============================================================================
# 27B instruct — lessons ported from 4B B4d-q (not a blind paste of 4B knobs)
#
# From 4B campaign:
#   √-law force mass, residual splat geometry (27B-scale σ/mass), online decay,
#   late F_a attenuate, ramp + targeted, mid-run prune (code)
# 27B can take longer budgets; short smoke first at 80, then raise carefully.
# =============================================================================

[physics]
